  <!-- Flower Petals -->
  <circle cx="32" cy="23" r="7" fill="url(#petalGrad)" opacity="0.95"/>
  <circle cx="23" cy="28" r="7" fill="url(#petalGrad)" opacity="0.95"/>
  <circle cx="41" cy="28" r="7" fill="url(#petalGrad)" opacity="0.95"/>
  <circle cx="27" cy="37" r="7" fill="url(#petalGrad)" opacity="0.95"/>
  <circle cx="37" cy="37" r="7" fill="url(#petalGrad)" opacity="0.95"/>
  <!-- Flower Center -->
  <circle cx="32" cy="30" r="5" fill="#D4A373"/>
  <circle cx="32" cy="30" r="3" fill="#FFFDF5"/>
