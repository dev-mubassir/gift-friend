      <stop offset="0%" stop-color="#E8C7CC" />
      <stop offset="100%" stop-color="#EBC9B5" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE8D5" />
